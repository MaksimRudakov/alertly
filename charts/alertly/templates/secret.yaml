{{- if .Values.secret.create -}}
{{- $cfg := .Values.config -}}
{{- $telegramEnabled := ternary true $cfg.telegram.enabled (not (hasKey $cfg.telegram "enabled")) -}}
{{- $slackEnabled := and $cfg.slack $cfg.slack.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "alertly.fullname" . }}
  labels:
    {{- include "alertly.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $telegramEnabled }}
  {{ .Values.secret.keys.botToken }}: {{ required "secret.values.telegramBotToken is required when secret.create=true and config.telegram.enabled" .Values.secret.values.telegramBotToken | b64enc }}
  {{- end }}
  {{- if $cfg.clusters }}
  {{- with .Values.secret.values.webhookAuthToken }}
  {{ $.Values.secret.keys.webhookAuth }}: {{ . | b64enc }}
  {{- end }}
  {{- else }}
  {{ .Values.secret.keys.webhookAuth }}: {{ required "secret.values.webhookAuthToken is required when secret.create=true (or define config.clusters with their own tokens)" .Values.secret.values.webhookAuthToken | b64enc }}
  {{- end }}
  {{- if $slackEnabled }}
  {{ .Values.secret.keys.slackBotToken }}: {{ required "secret.values.slackBotToken is required when secret.create=true and config.slack.enabled" .Values.secret.values.slackBotToken | b64enc }}
  {{- end }}
  {{- with .Values.secret.values.alertmanagerUsername }}
  {{ $.Values.secret.keys.alertmanagerUsername }}: {{ . | b64enc }}
  {{- end }}
  {{- with .Values.secret.values.alertmanagerPassword }}
  {{ $.Values.secret.keys.alertmanagerPassword }}: {{ . | b64enc }}
  {{- end }}
  {{- with .Values.secret.values.alertmanagerToken }}
  {{ $.Values.secret.keys.alertmanagerToken }}: {{ . | b64enc }}
  {{- end }}
  {{- range $k, $v := .Values.secret.values.extra }}
  {{ $k }}: {{ $v | b64enc }}
  {{- end }}
{{- end }}
